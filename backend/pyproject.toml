[project]
name = "stockstack-backend"
version = "0.1.0"
description = "StockStack product management backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.116,<1",
    "greenlet>=3.2,<4",
    "jsonschema>=4.25,<5",
    "nh3>=0.3,<1",
    "prometheus-client>=0.22,<1",
    "pwdlib[argon2]>=0.2,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "pyjwt>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "redis>=6.4,<7",
    "sqlalchemy>=2.0,<3",
    "uuid6>=2025.0,<2026",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
